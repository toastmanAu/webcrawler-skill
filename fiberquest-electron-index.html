<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiberQuest Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(120deg, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 1.1em;
      color: #cbd5e1;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .status-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(100, 165, 250, 0.3);
      border-radius: 10px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .status-card h3 {
      font-size: 1.1em;
      margin-bottom: 10px;
      color: #60a5fa;
    }

    .status-card p {
      font-size: 1em;
      color: #94a3b8;
    }

    .status-value {
      font-size: 1.2em;
      font-weight: bold;
      color: #34d399;
      margin-top: 10px;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: linear-gradient(120deg, #60a5fa, #3b82f6);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(96, 165, 250, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: #64748b;
      font-size: 0.9em;
    }

    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 FiberQuest Demo</h1>
      <p>Decentralized Tournament Platform on CKB</p>
    </header>

    <div class="status-grid">
      <div class="status-card">
        <h3>Website</h3>
        <p>Frontend & API</p>
        <div class="status-value" id="website-status">
          <span class="loading">⟳</span> Checking...
        </div>
      </div>

      <div class="status-card">
        <h3>Database</h3>
        <p>PostgreSQL</p>
        <div class="status-value" id="db-status">
          <span class="loading">⟳</span> Checking...
        </div>
      </div>

      <div class="status-card">
        <h3>Inference</h3>
        <p>Local or Cloud</p>
        <div class="status-value" id="inference-status">
          <span class="loading">⟳</span> Checking...
        </div>
      </div>
    </div>

    <div class="buttons">
      <button onclick="openWebsite()">Open Website</button>
      <button onclick="openRetroArch()">Launch RetroArch</button>
      <button onclick="toggleDevTools()">Developer Tools</button>
      <button onclick="refreshStatus()">Refresh Status</button>
    </div>

    <div class="footer">
      <p>FiberQuest v1.0 · Running on Raspberry Pi 5 · <span id="timestamp"></span></p>
    </div>
  </div>

  <script>
    // Check service status
    async function checkStatus() {
      try {
        const info = await window.electronAPI.invokeServiceInfo();
        document.getElementById('website-status').textContent = info.website || '✅ Online';
        document.getElementById('db-status').textContent = info.postgresql || '✅ Ready';
        document.getElementById('inference-status').textContent = '✅ Available';
      } catch (e) {
        console.error('Status check failed:', e);
      }
      updateTimestamp();
    }

    function updateTimestamp() {
      const now = new Date();
      document.getElementById('timestamp').textContent = now.toLocaleTimeString();
    }

    function openWebsite() {
      window.location.href = 'http://localhost:3000';
    }

    function openRetroArch() {
      // Launch RetroArch (would need Node.js child_process)
      alert('RetroArch launching... check desktop');
    }

    function toggleDevTools() {
      window.electronAPI.openDevTools();
    }

    function refreshStatus() {
      checkStatus();
    }

    // Auto-check status every 10 seconds
    checkStatus();
    setInterval(updateTimestamp, 1000);
    setInterval(checkStatus, 10000);
  </script>
</body>
</html>
